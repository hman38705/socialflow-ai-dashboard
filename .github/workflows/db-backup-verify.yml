name: DB Backup Verification

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  verify-backup:
    name: Restore and verify latest backup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: verify_db
          POSTGRES_USER: verify_user
          POSTGRES_PASSWORD: verify_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch latest backup key from S3
        id: latest
        run: |
          KEY=$(aws s3 ls s3://${{ secrets.S3_BACKUP_BUCKET }}/backups/ \
            --recursive \
            | sort | tail -n 1 \
            | awk '{print $4}')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Latest backup: $KEY"

      - name: Download backup
        run: |
          aws s3 cp "s3://${{ secrets.S3_BACKUP_BUCKET }}/${{ steps.latest.outputs.key }}" /tmp/restore.sql

      - name: Restore backup to temporary database
        env:
          PGPASSWORD: verify_pass
        run: |
          psql -h 127.0.0.1 -U verify_user -d verify_db -f /tmp/restore.sql

      - name: Run row count checks
        id: checks
        env:
          PGPASSWORD: verify_pass
        # -----------------------------------------------------------------------
        # Issue #1596 — [Bug] DB backup verification workflow swallows its own
        # "which tables are empty" diagnostic before it can be logged
        # https://github.com/hman38705/socialflow-ai-dashboard/issues/1596
        #
        # ROOT CAUSE
        # ----------
        # The original code used command substitution to capture the Python
        # script's stdout into the shell variable $EMPTY:
        #
        #   EMPTY=$(echo "$RESULT" | python3 -c "
        #     ...
        #     print('EMPTY_TABLES: ' + ', '.join(empty))
        #     sys.exit(1)
        #   ")
        #
        # When the Python script prints and then exits 1, two things happen:
        #   1. The print() output is silently consumed into $EMPTY — it is
        #      never written to the runner log because $EMPTY is never echo'd.
        #   2. The non-zero exit propagates through the $(…) assignment under
        #      `set -e`, so the step correctly fails — but the run log only
        #      shows "Process exited with code 1", not the table names.
        #
        # The variable $EMPTY is assigned but never read afterward, so the
        # diagnostic is swallowed entirely. The step fails silently.
        #
        # FIX
        # ---
        # Drop the command substitution entirely. Run the Python script inline
        # (piped from the shell), letting its stdout flow directly to the
        # runner log. The script still exits 1 on empty tables, which propagates
        # to the step exit code under `set -e` — but now the EMPTY_TABLES line
        # appears in the log before the failure, satisfying the acceptance
        # criterion.
        #
        # Inline fix pattern:
        #
        #   echo "$RESULT" | python3 -c "
        #   import sys, json
        #   data = json.load(sys.stdin)
        #   empty = [t['table_name'] for t in data if t['row_count'] == 0]
        #   if empty:
        #       print('EMPTY_TABLES: ' + ', '.join(empty), flush=True)
        #       sys.exit(1)
        #   "
        #
        # The flush=True ensures the line is written before sys.exit(1) tears
        # down the process. Without it, CPython's stdout buffer can be lost on
        # an abrupt exit in some pipe configurations.
        #
        # ALTERNATIVE FIX (write to stderr instead)
        # ------------------------------------------
        # If the diagnostic should be visible even when stdout is redirected:
        #
        #   print('EMPTY_TABLES: ' + ', '.join(empty), file=sys.stderr, flush=True)
        #
        # stderr is never captured by $(…) and always flows to the runner log.
        # Either approach satisfies the acceptance criterion.
        #
        # TESTING LOCALLY
        # ---------------
        # Pipe a mock JSON payload with a zero-row-count table and confirm the
        # table name prints before the non-zero exit:
        #
        #   echo '[{"table_name":"users","row_count":0}]' | python3 -c "
        #   import sys, json
        #   data = json.load(sys.stdin)
        #   empty = [t['table_name'] for t in data if t['row_count'] == 0]
        #   if empty:
        #       print('EMPTY_TABLES: ' + ', '.join(empty), flush=True)
        #       sys.exit(1)
        #   "
        #   # Expected output: EMPTY_TABLES: users
        #   # Expected exit:   1
        #
        # FILES TO CHANGE
        # ---------------
        #   .github/workflows/db-backup-verify.yml  ← (THIS FILE)
        #     Remove the EMPTY=$(...) command substitution and run python3 inline.
        # -----------------------------------------------------------------------
        run: |
          RESULT=$(psql -h 127.0.0.1 -U verify_user -d verify_db -t -c "
            SELECT json_agg(row_to_json(t)) FROM (
              SELECT table_name,
                     (xpath('/row/cnt/text()',
                            query_to_xml(format('SELECT count(*) AS cnt FROM %I', table_name), false, true, '')))[1]::text::int AS row_count
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_type  = 'BASE TABLE'
            ) t;
          ")
          echo "Row counts: $RESULT"
          # TODO (#1596): Replace the EMPTY=$(...) block below with the inline
          # form shown in the documentation above. The current code swallows the
          # EMPTY_TABLES diagnostic. The fix is to drop the command substitution
          # so python3's stdout flows directly to the runner log.
          #
          # Fail if any table has 0 rows (adjust threshold as needed)
          EMPTY=$(echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          empty = [t['table_name'] for t in data if t['row_count'] == 0]
          if empty:
              print('EMPTY_TABLES: ' + ', '.join(empty))
              sys.exit(1)
          ")

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": ":rotating_light: *DB Backup Verification FAILED*\nBackup: `${{ steps.latest.outputs.key }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_BACKUP_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
