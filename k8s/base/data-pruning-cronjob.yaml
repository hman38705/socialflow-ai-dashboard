# Data pruning CronJob
#
# Purpose: applies the data retention policy by pruning (archiving or deleting)
# aged log and analytics files from the shared data volume.
# Schedule: daily at 03:00 UTC (see spec.schedule below).
#
# Retention settings (DATA_RETENTION_*) are read from the socialflow-config
# ConfigMap / socialflow-secrets Secret via envFrom. The authoritative
# description of the policy lives in backend/docs/retention-pruning-policy.md;
# see also the DATA_RETENTION_* rows in the README.md variable table.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: socialflow-data-pruning
  labels:
    app.kubernetes.io/name: socialflow-data-pruning
    app.kubernetes.io/component: data-pruning
    app.kubernetes.io/part-of: socialflow
spec:
  # Retention schedule: run daily at 03:00 UTC.
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: socialflow-data-pruning
            app.kubernetes.io/component: data-pruning
            app.kubernetes.io/part-of: socialflow
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: data-pruning
              image: socialflow-backend:latest
              imagePullPolicy: IfNotPresent
              command:
                - node
                - dist/scripts/data-pruning.js
              envFrom:
                - configMapRef:
                    name: socialflow-config
                - secretRef:
                    name: socialflow-secrets
              env:
                - name: NODE_ENV
                  value: production
                # Missing-path handling (optional; see README.md variable table and
                # backend/docs/retention-pruning-policy.md for details):
                #
                # DATA_RETENTION_MISSING_PATH_POLICY: what the job does when a
                # configured retention path does not exist.
                #   warn   - log a warning and continue (default)
                #   fail   - treat it as an error and fail the run
                #   ignore - skip silently
                # Take care before shipping `fail` to production: a single absent
                # path will fail the whole job.
                #
                # DATA_RETENTION_MISSING_PATH_ALERT_THRESHOLD: fire an alert when
                # the number of missing paths in a single run reaches this value
                # (default 3).
                #
                # Both are normally inherited from socialflow-config; uncomment to
                # override for this job only.
                # - name: DATA_RETENTION_MISSING_PATH_POLICY
                #   value: "warn"
                # - name: DATA_RETENTION_MISSING_PATH_ALERT_THRESHOLD
                #   value: "3"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: shared-data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: shared-data
              persistentVolumeClaim:
                claimName: socialflow-shared-data
            - name: tmp
              emptyDir: {}