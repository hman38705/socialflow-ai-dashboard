apiVersion: batch/v1
kind: CronJob
metadata:
  name: socialflow-data-pruning
  labels:
    app: socialflow-data-pruning
spec:
  # Data retention pruning job. Runs on the schedule below to delete records
  # that have exceeded their retention window. The retention contract (modes,
  # missing-path handling) is documented in backend/docs/retention-pruning-policy.md
  # and the DATA_RETENTION_* rows of the README variable table.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: socialflow-data-pruning
        spec:
          serviceAccountName: socialflow-backend
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: prune
              image: socialflow-backend:latest
              imagePullPolicy: Always
              command: ["node", "dist/scripts/pruneData.js"]
              envFrom:
                - configMapRef:
                    name: socialflow-config
                - secretRef:
                    name: socialflow-secrets
              env:
                # How to handle a retention path that is absent at prune time:
                # warn | fail | ignore (default: warn). See
                # backend/docs/retention-pruning-policy.md and the README
                # variable table for the authoritative description.
                - name: DATA_RETENTION_MISSING_PATH_POLICY
                  value: "warn"
                # Number of missing retention paths tolerated before an alert is
                # raised (default: 3). See backend/docs/retention-pruning-policy.md
                # and the README variable table.
                - name: DATA_RETENTION_MISSING_PATH_ALERT_THRESHOLD
                  value: "3"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
