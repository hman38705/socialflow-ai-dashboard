# Non-sensitive runtime configuration.
# Sensitive values (DATABASE_URL, JWT_SECRET, etc.) go in socialflow-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: socialflow-config
data:
  NODE_ENV: "production"
  BACKEND_PORT: "3001"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  LOG_LEVEL: "info"
  OTEL_SERVICE_NAME: "socialflow-backend"
  OTEL_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring:4318/v1/traces"
  DATA_RETENTION_MODE: "archive"
  DATA_PRUNING_CRON: "0 2 * * *"
  DATA_RETENTION_LOG_DAYS: "30"
  DATA_RETENTION_ANALYTICS_DAYS: "90"
  # Policy applied when a retention path is absent: warn | fail | ignore (default: warn).
  # See backend/docs/retention-pruning-policy.md and the README variable table.
  DATA_RETENTION_MISSING_PATH_POLICY: "warn"
  # Number of missing retention paths before an alert fires (default: 3).
  # See backend/docs/retention-pruning-policy.md and the README variable table.
  DATA_RETENTION_MISSING_PATH_ALERT_THRESHOLD: "3"
