# ExternalSecret — syncs secrets from AWS Secrets Manager via External Secrets Operator.
# The ClusterSecretStore (cluster-secret-store.yaml) configures ESO authentication.
# This manifest references a secret in AWS Secrets Manager and creates a Kubernetes Secret.
#
# =============================================================================
# Issue #1599 — [Critical] ExternalSecret never syncs STRIPE_SECRET_KEY,
# a required config key with no default — backend fails to boot on a real
# cluster deploy
# https://github.com/hman38705/socialflow-ai-dashboard/issues/1599
#
# ROOT CAUSE
# ----------
# backend/src/config/config.ts declares STRIPE_SECRET_KEY as a strictly
# required zod field — no .optional(), no .default():
#
#   STRIPE_SECRET_KEY: z.string().min(1, 'STRIPE_SECRET_KEY is required'),
#
# The zod schema is validated eagerly at process startup via the `config`
# Proxy. A missing STRIPE_SECRET_KEY causes validateEnv() to throw:
#
#   Environment validation failed:
#     • STRIPE_SECRET_KEY: STRIPE_SECRET_KEY is required
#
# The process exits/crash-loops before serving any traffic.
#
# This manifest is the ONLY mechanism that populates the `socialflow-secrets`
# Kubernetes Secret (referenced by deployment.yaml and worker-deployment.yaml
# via envFrom.secretRef). The current data: list syncs 6 keys:
#   DATABASE_URL, REDIS_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET,
#   TWITTER_API_KEY, TWITTER_API_SECRET.
#
# STRIPE_SECRET_KEY is absent — no other Secret or ConfigMap in k8s/base/
# supplies it. Any cluster deploy with billing enabled (backend/src/modules/
# billing/) crash-loops immediately.
#
# FULL AUDIT OF STRICTLY-REQUIRED KEYS vs. SYNCED KEYS
# -----------------------------------------------------
# Cross-checking every z.string().min(1, ...) field in config.ts (no
# .optional() / .default()) against this manifest's data: list:
#
#   Key                   config.ts treatment           Synced here?
#   ─────────────────────────────────────────────────────────────────
#   JWT_SECRET            z.string().min(32) required   ✅ YES
#   JWT_REFRESH_SECRET    z.string().min(32) required   ✅ YES
#   CSRF_SECRET           z.string().min(32) required   ❌ MISSING
#   TWITTER_API_KEY       z.string().min(1)  required   ✅ YES
#   TWITTER_API_SECRET    z.string().min(1)  required   ✅ YES
#   STRIPE_SECRET_KEY     z.string().min(1)  required   ❌ MISSING
#
# DATABASE_URL is .optional() (the superRefine handles the DB_HOST fallback),
# but the deployment is configured to supply it, so it is included correctly.
# REDIS_PASSWORD is .optional() in the schema but is included here — this is
# fine; including optional secrets is harmless.
#
# THREE KEYS ARE MISSING from this manifest that will cause crash-loops:
#   1. STRIPE_SECRET_KEY  — billing module; backend and worker both use it
#   2. CSRF_SECRET        — CSRF middleware; backend only
#
# (OTEL_SERVICE_NAME has a .default() so it is not at risk.)
#
# FIX
# ---
# Add the missing entries to the data: list below. Each entry follows the
# same pattern as the existing entries, referencing the socialflow/backend
# AWS Secrets Manager secret:
#
#   - secretKey: STRIPE_SECRET_KEY
#     remoteRef:
#       key: socialflow/backend
#       property: STRIPE_SECRET_KEY
#
#   - secretKey: CSRF_SECRET
#     remoteRef:
#       key: socialflow/backend
#       property: CSRF_SECRET
#
# BEFORE APPLYING: ensure the corresponding properties exist in the
# socialflow/backend secret in AWS Secrets Manager. If they do not exist,
# ESO will set the ExternalSecret status to SecretSyncedError and the
# Kubernetes Secret will not be updated (pods continue crash-looping).
#
# TESTING
# -------
# After applying the updated manifest:
#
#   1. Confirm the Kubernetes Secret contains the new keys:
#      kubectl get secret socialflow-secrets -o jsonpath='{.data}' | \
#        python3 -c "import sys,json,base64; d=json.load(sys.stdin); \
#        [print(k, base64.b64decode(v).decode()[:4]+'...') for k,v in d.items()]"
#      # STRIPE_SECRET_KEY and CSRF_SECRET must appear
#
#   2. Cross-check: run the following against config.ts to catch any future
#      drift between required keys and synced keys:
#
#      # In repo root:
#      grep -E "z\.string\(\)\.min\(1" backend/src/config/config.ts \
#        | grep -v optional | grep -v default
#      # Each key found must have a matching entry in this file's data: list.
#
# FILES TO CHANGE
# ---------------
#   k8s/base/external-secret.yaml  ← (THIS FILE)
#     Add STRIPE_SECRET_KEY and CSRF_SECRET entries to data: list
#   backend/src/config/config.ts   ← no change needed (schema is correct)
#
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: socialflow-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: socialflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: socialflow/backend
        property: DATABASE_URL
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: socialflow/backend
        property: REDIS_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: socialflow/backend
        property: JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: socialflow/backend
        property: JWT_REFRESH_SECRET
    - secretKey: TWITTER_API_KEY
      remoteRef:
        key: socialflow/backend
        property: TWITTER_API_KEY
    - secretKey: TWITTER_API_SECRET
      remoteRef:
        key: socialflow/backend
        property: TWITTER_API_SECRET
