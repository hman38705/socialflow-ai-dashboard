apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socialflow-backend
spec:
  podSelector:
    matchLabels:
      app: socialflow-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS - required for all name resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Redis (ElastiCache) - session and queue storage
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # PostgreSQL (RDS) - primary database
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # MeiliSearch - full-text search
    - to:
        - podSelector:
            matchLabels:
              app: meilisearch
      ports:
        - protocol: TCP
          port: 7700
    # OTLP collector - observability telemetry
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4318
    # External platform APIs - HTTPS only (Stripe, Twitter, Facebook, Instagram, TikTok, YouTube, LinkedIn)
    # -------------------------------------------------------------------------
    # Issue #1597 — [Critical] NetworkPolicy "external platform APIs" egress
    # rule cannot reach any external IP — namespaceSelector: {} only matches
    # in-cluster pods
    # https://github.com/hman38705/socialflow-ai-dashboard/issues/1597
    #
    # ROOT CAUSE
    # ----------
    # The current rule uses:
    #
    #   - to:
    #       - namespaceSelector: {}
    #     ports:
    #       - protocol: TCP
    #         port: 443
    #
    # Per the Kubernetes NetworkPolicy specification, namespaceSelector and
    # podSelector peers ONLY match Pod IPs inside the cluster (they are
    # resolved by the CNI against namespace/pod label indexes). They cannot
    # reference arbitrary external internet destinations.
    #
    # namespaceSelector: {} means "all namespaces in this cluster" — it does
    # NOT mean "the internet." In any cluster where the CNI (Calico, Cilium,
    # Weave, etc.) enforces NetworkPolicy, this rule permits port-443 egress
    # to other pods but NOT to api.stripe.com, graph.facebook.com,
    # api.twitter.com, etc. Every external social/payment API call silently
    # times out or is dropped.
    #
    # NOTE: The DNS rule at the top of the egress list has the same
    # namespaceSelector: {} form. For DNS (kube-dns / CoreDNS) this is
    # coincidentally correct because the DNS pods ARE inside the cluster.
    # For the external HTTPS rule it is wrong.
    #
    # FIX
    # ---
    # Replace the namespaceSelector: {} peer with an ipBlock covering the
    # external internet. The standard approach is to allow the entire public
    # address space minus RFC-1918 private ranges:
    #
    #   - to:
    #       - ipBlock:
    #           cidr: 0.0.0.0/0
    #           except:
    #             - 10.0.0.0/8       # RFC-1918 class A
    #             - 172.16.0.0/12    # RFC-1918 class B
    #             - 192.168.0.0/16   # RFC-1918 class C
    #             - 100.64.0.0/10    # Carrier-grade NAT (RFC-6598)
    #     ports:
    #       - protocol: TCP
    #         port: 443
    #
    # This allows egress to any public IP on port 443 while keeping the
    # existing pod-selector rules for in-cluster services intact.
    #
    # ALTERNATIVES (if pinning specific CIDRs is preferred)
    # ------------------------------------------------------
    # Pin the published CIDR ranges for each external service:
    #
    #   Stripe:    3.18.12.63/32, 3.130.192.231/32, ... (see https://stripe.com/files/ips/ips_webhooks.txt)
    #   Twitter:   199.16.156.0/22, 199.59.148.0/22, ...
    #   Facebook:  31.13.24.0/21, 66.220.144.0/20, ...
    #   (Full lists available from each provider's documentation)
    #
    # Pinned CIDRs are more restrictive but require maintenance when providers
    # rotate their IP ranges. The 0.0.0.0/0 minus RFC-1918 approach is more
    # durable for SaaS APIs with volatile IP ranges.
    #
    # EGRESS GATEWAY ALTERNATIVE
    # ---------------------------
    # If the cluster uses Cilium or Calico Enterprise, a DNS-based egress
    # policy (CiliumNetworkPolicy with toFQDNs, or Calico's GlobalNetworkPolicy
    # with domainName) can reference hostnames directly:
    #
    #   toFQDNs:
    #     - matchName: api.stripe.com
    #     - matchName: api.twitter.com
    #     - matchName: graph.facebook.com
    #     - matchName: graph.instagram.com
    #     - matchName: open.tiktokapis.com
    #     - matchName: www.googleapis.com
    #     - matchName: api.linkedin.com
    #
    # This requires the CNI-specific CRD and is out of scope for a plain
    # NetworkPolicy fix, but should be evaluated for production hardening.
    #
    # TESTING
    # -------
    # With a CNI that enforces NetworkPolicy (e.g. Calico in kind/minikube):
    #
    #   1. Apply the CURRENT policy and verify external HTTPS is blocked:
    #      kubectl exec -n staging deploy/socialflow-backend \
    #        -- curl -I --max-time 5 https://api.stripe.com
    #      # Expected: Connection timed out (or dropped) — confirms the bug
    #
    #   2. Apply the FIXED policy and verify external HTTPS is allowed:
    #      kubectl exec -n staging deploy/socialflow-backend \
    #        -- curl -I --max-time 10 https://api.stripe.com
    #      # Expected: HTTP/2 200 (or redirect) — confirms the fix
    #
    # FILES TO CHANGE
    # ---------------
    #   k8s/base/networkpolicy.yaml  ← (THIS FILE)
    #     Replace `- namespaceSelector: {}` under the port-443 egress rule
    #     with `- ipBlock: { cidr: 0.0.0.0/0, except: [...RFC-1918...] }`
    # -------------------------------------------------------------------------
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
