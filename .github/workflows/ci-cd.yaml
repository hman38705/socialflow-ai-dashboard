name: Staging CI/CD Pipeline

on:
  push:
    branches: ["main", "develop", "staging", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-flight staging deploy: a half-finished kubectl rollout is worse than a late one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  deploy-staging:
    name: Continuous Deployment (Staging)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/socialflow-backend
      TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          # Only the immutable commit SHA tag is published; no mutable :latest
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        id: deploy
        # -----------------------------------------------------------------------
        # Issue #1598 — [High] Staging CD pipeline updates socialflow-backend
        # deployment image but never touches socialflow-worker
        # https://github.com/hman38705/socialflow-ai-dashboard/issues/1598
        #
        # ROOT CAUSE
        # ----------
        # This step only builds backend/Dockerfile (tagged socialflow-backend)
        # and only updates the socialflow-backend Deployment. k8s/base/
        # worker-deployment.yaml defines a separate socialflow-worker Deployment
        # (container name: worker) built from backend/Dockerfile.worker. Nothing
        # in this pipeline builds, pushes, or deploys the worker image.
        #
        # As a result, every staging deploy leaves the worker pods running
        # whatever image they were last manually updated to. Background job code
        # (BullMQ workers for AI analysis, post publishing, translation, TTS,
        # video transcode) runs stale logic indefinitely while the API server
        # runs the latest commit — silently, with no error or warning.
        #
        # FIX
        # ---
        # Two changes are needed:
        #
        # 1. Add a second "Build and push worker image" step BEFORE this step,
        #    building backend/Dockerfile.worker and tagging it as socialflow-worker:
        #
        #    env:
        #      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/socialflow-worker
        #      TAG: ${{ github.sha }}
        #
        #    - name: Build and push worker Docker image
        #      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        #      with:
        #        context: ./backend
        #        file: backend/Dockerfile.worker
        #        push: true
        #        tags: |
        #          ${{ env.WORKER_IMAGE }}:${{ env.TAG }}
        #          ${{ env.WORKER_IMAGE }}:latest
        #
        # 2. Extend this "Deploy to Kubernetes" step to also update the
        #    socialflow-worker Deployment and wait for its rollout:
        #
        #    kubectl set image deployment/socialflow-worker \
        #      worker=${{ env.WORKER_IMAGE }}:${{ env.TAG }} \
        #      --namespace=staging
        #    kubectl rollout status deployment/socialflow-worker \
        #      --namespace=staging \
        #      --timeout=120s
        #
        # Both deployments must use the same ${{ github.sha }} tag so a single
        # commit always produces matching API server + worker images.
        #
        # ACCEPTANCE CRITERIA
        # -------------------
        # After the fix, a staging deploy triggered by a push to the staging
        # branch must update BOTH deployments to the same commit SHA tag.
        # Verify with:
        #
        #   kubectl get deployment socialflow-worker \
        #     -o jsonpath='{.spec.template.spec.containers[0].image}' \
        #     --namespace=staging
        #   # Must equal: ghcr.io/<owner>/socialflow-worker:<sha>
        #
        # FILES TO CHANGE
        # ---------------
        #   .github/workflows/ci-cd.yaml  ← (THIS FILE)
        #     1. Add WORKER_IMAGE env var alongside IMAGE
        #     2. Add "Build and push worker Docker image" step
        #     3. Extend "Deploy to Kubernetes" step with worker kubectl commands
        # -----------------------------------------------------------------------
        run: |
          # Run migrations once, before any backend pod is rolled out.
          kubectl delete job socialflow-migrate --namespace=staging --ignore-not-found
          sed "s|image: socialflow-backend:latest|image: ${IMAGE}:${TAG}|" k8s/base/migration-job.yaml \
            | kubectl apply --namespace=staging -f -
          kubectl wait job/socialflow-migrate \
            --for=condition=complete \
            --namespace=staging \
            --timeout=300s
          kubectl set image deployment/socialflow-backend \
            migrate=${{ env.IMAGE }}:${{ env.TAG }} \
            backend=${{ env.IMAGE }}:${{ env.TAG }} \
            --namespace=staging
          kubectl rollout status deployment/socialflow-backend \
            --namespace=staging \
            --timeout=120s
          # TODO (#1598): Add worker deployment update here:
          # kubectl set image deployment/socialflow-worker \
          #   worker=ghcr.io/${{ github.repository_owner }}/socialflow-worker:${{ env.TAG }} \
          #   --namespace=staging
          # kubectl rollout status deployment/socialflow-worker \
          #   --namespace=staging \
          #   --timeout=120s

      - name: Roll back failed staging deploy
        # Runs only when the Deploy step itself failed (failed or timed-out rollout).
        # Pod logs are captured before the undo, since the undo replaces the failing pods.
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        run: |
          echo "::group::Failing pod logs (socialflow-backend)"
          kubectl logs deployment/socialflow-backend \
            --namespace=staging \
            --all-containers \
            --tail=200 || true
          kubectl get pods --namespace=staging -o wide || true
          echo "::endgroup::"
          kubectl rollout undo deployment/socialflow-backend \
            --namespace=staging
          kubectl rollout status deployment/socialflow-backend \
            --namespace=staging \
            --timeout=120s

      - name: Smoke test /health
        env:
          BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          echo "Polling ${BACKEND_URL}/health ..."
          timeout 120 bash -c \
            'until curl -sf --max-time 10 "${BACKEND_URL}/health"; do echo "waiting..."; sleep 5; done'
          echo "Health check passed"
